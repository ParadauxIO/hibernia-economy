name: Set up JVM build
description: >-
  Validate the Gradle wrapper, install Temurin JDK 21 and set up Gradle (Gradle
  user-home + build-cache caching). Every JVM job ran this same sequence by hand.

# actions/checkout stays in the calling job: a local action can only be loaded
# from an already checked-out repository. The wrapper is invoked as
# `sh ./gradlew` everywhere because gradlew is committed without the exec bit.
#
# setup-gradle writes its cache only from the default branch (develop) and reads
# it everywhere else, so PR runs reuse develop's build cache but never pollute it.

runs:
  using: composite
  steps:
    # ADT-171: verify the wrapper jar before running it (some callers hold
    # publish or registry credentials).
    - name: Validate Gradle wrapper
      uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

    - name: Set up JDK 21
      uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
      with:
        distribution: temurin
        java-version: '21'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
