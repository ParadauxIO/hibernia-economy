name: Integration Tests (live server)

# Boots a real Paper server with the plugins built from this commit, a migrated
# MariaDB and the REST API, then runs the mock-client suite in integration-tests/
# against it. ops/integration/run.sh is the whole environment — the same script
# runs locally.

on:
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'treasury/**'
      - 'business/**'
      - 'chestshop/**'
      - 'treasury-api-plugin/**'
      - 'treasury-rest-api/**'
      - 'common/**'
      - 'economy-flyway/**'
      - 'gradle/**'
      - 'build-logic/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'ops/integration/**'
      - 'integration-tests/**'
      - '.github/workflows/integration-tests.yml'
  workflow_dispatch:
    inputs:
      test_filter:
        description: Optional Gradle test filter, e.g. '*PayCommandTest'
        default: ''

permissions:
  contents: read

concurrency:
  group: integration-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: dev
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Cache server downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/hibernia-it
          key: hibernia-it-${{ hashFiles('ops/integration/run.sh') }}

      - name: Run the live integration tests
        env:
          IT_DB_EXTERNAL: '1'
          IT_DB_HOST: 127.0.0.1
          IT_DB_PORT: '3306'
          IT_DB_USER: root
          IT_DB_PASSWORD: dev
          TEST_FILTER: ${{ inputs.test_filter }}
        run: |
          args=()
          if [ -n "$TEST_FILTER" ]; then args=(-- --tests "$TEST_FILTER"); fi
          bash ops/integration/run.sh "${args[@]}"

      - name: Upload logs and test reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: integration-tests
          path: |
            build/integration/*.log
            integration-tests/tests/build/reports/tests/
            integration-tests/tests/build/test-results/
          if-no-files-found: ignore
