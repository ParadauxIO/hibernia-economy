name: Economy Flyway · Info (read-only)

# Manual-only. Runs flywayInfo + flywayValidate against the chosen target
# without applying anything. No approval gate — anyone with workflow-run
# permission on the repo can use this to see "what's pending" before
# requesting an actual migration.

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Target environment'
        type: choice
        options:
          - democracycraft
          - statecraft
        required: true

permissions:
  contents: read

jobs:
  info:
    name: flywayInfo + flywayValidate against ${{ inputs.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Use the chosen environment so its secrets (FLYWAY_URL etc.) are scoped
    # in. Configure these per-environment in repo settings, NOT here.
    environment: ${{ inputs.target }}
    env:
      FLYWAY_URL: ${{ secrets.FLYWAY_URL }}
      FLYWAY_USER: ${{ secrets.FLYWAY_USER }}
      FLYWAY_PASSWORD: ${{ secrets.FLYWAY_PASSWORD }}
      FLYWAY_SCHEMA: ${{ secrets.FLYWAY_SCHEMA }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JVM build
        uses: ./.github/actions/setup-jvm

      - name: flywayInfo (pending + applied migrations)
        run: sh ./gradlew :economy-flyway:flywayInfo

      # Fatal. Pending migrations are the expected state before a migrate (and
      # every migration is pending on a green-field DB), so they are ignored;
      # anything else — an applied script whose checksum no longer matches the
      # file, an applied version missing on disk, a failed migration — means
      # flywayMigrate would refuse to run, and is worth a red run here first.
      - name: flywayValidate (on-disk vs flyway_schema_history, pending ignored)
        run: sh ./gradlew :economy-flyway:flywayValidate '-Dflyway.ignoreMigrationPatterns=*:pending'
