name: Treasury REST API · Build and Push Docker Image to Harbor

on:
  push:
    branches:
      - main
      - develop
    # Everything that ends up in (or gates) the image: the service itself, its
    # one project() dependency (:common, shaded into the bootJar), the shared
    # build inputs that decide which library versions get bundled (version
    # catalog, convention plugins, root build/settings), and the reused test
    # workflow. Without these, a :common fix or a dependency bump merges without
    # ever producing a new image.
    paths:
      - 'treasury-rest-api/**'
      - 'common/**'                # implementation(project(":common"))
      - 'gradle/**'                # libs.versions.toml + wrapper
      - 'build-logic/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/treasury-rest-api-docker.yml'
      - '.github/workflows/treasury-rest-api-test.yml'

# The called treasury-rest-api-test.yml requests checks: write to surface JUnit
# results; a reusable workflow can't exceed its caller's permissions, and this
# workflow had none (so the restrictive repo default applied), which failed the
# run at startup. Declare them here (also clears the missing-workflow-permissions
# CodeQL warning). Checkout needs contents: read; the Harbor push authenticates
# with registry secrets, not GITHUB_TOKEN.
permissions:
  contents: read
  checks: write

jobs:
  # Gate the image on the real test suite (ADT-19): the money service must not
  # build+push without its *IT suite passing. Reuses treasury-rest-api-test.yml.
  test:
    uses: ./.github/workflows/treasury-rest-api-test.yml

  build-and-push:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Validate Gradle wrapper   # ADT-171: verify wrapper jar before running it with Harbor creds
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      # Build the Spring Boot fat jar via the root build (the service is no longer
      # a standalone Gradle build) and stage it next to the Dockerfile so the
      # runtime-only image can just COPY it.
      - name: Build bootJar
        run: ./gradlew --no-daemon :treasury-rest-api:clean :treasury-rest-api:bootJar -x test

      - name: Stage jar for Docker context
        run: cp treasury-rest-api/build/libs/*.jar treasury-rest-api/app.jar

      - name: Compute tags
        id: tags
        run: |
          # Treasury is one shared image used by all in-cluster instances
          # (UAT in development namespace; DemocracyCraft + StateCraft in
          # production namespace). Single Harbor repo —
          # paradaux-public/treasury-rest-api — backs everything; runtime
          # differences (DB url, JWT secret, rate-limit Redis) are env-var-only.
          #
          # Env-prefixed immutable tag — Argo CD Image Updater watches
          # `<env>-sha-<short>` per kustomize overlay. The prefix MUST match
          # the overlay directory name (development / production) because the
          # registration's allow-tags regex is `^{{path.basename}}-sha-[0-9a-f]{7}$`
          # (bootstrap/registrations/apps.yaml). Mutable tag (latest / prod)
          # kept for manual rollbacks.
          #   main    -> production-sha-<short>  (+ :prod)   -> production overlay
          #   develop -> development-sha-<short> (+ :latest) -> development overlay
          SHORT_SHA=${GITHUB_SHA::7}
          if [ "${{ github.ref_name }}" == "main" ]; then
            ENV_NAME=production
            MUTABLE=prod
          elif [ "${{ github.ref_name }}" == "develop" ]; then
            ENV_NAME=development
            MUTABLE=latest
          else
            echo "::error::Unsupported branch: ${{ github.ref_name }}"
            exit 1
          fi
          echo "SHA_TAG=${ENV_NAME}-sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "MUTABLE_TAG=${MUTABLE}" >> "$GITHUB_OUTPUT"

      # PAR-329: provenance/SBOM attestations below need the docker-container
      # driver. Without this step build-push-action falls back to the default
      # `docker` driver, which can't emit them, and the build fails outright.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to Harbor registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ secrets.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      # Build + push via docker/build-push-action so images carry provenance
      # attestations and an SBOM (global/infra/0004). Every action in this
      # release path is pinned to a full commit SHA (the trailing comment is the
      # release it corresponds to) — bump SHA and comment together. Immutable
      # env-sha tag + mutable tag and the Harbor registry auth (docker/login-action
      # above) are unchanged.
      - name: Build and push Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: treasury-rest-api
          push: true
          provenance: true
          sbom: true
          tags: |
            ${{ secrets.HARBOR_REGISTRY }}/paradaux-public/treasury-rest-api:${{ steps.tags.outputs.SHA_TAG }}
            ${{ secrets.HARBOR_REGISTRY }}/paradaux-public/treasury-rest-api:${{ steps.tags.outputs.MUTABLE_TAG }}
