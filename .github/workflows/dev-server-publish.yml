name: Dev server · Publish plugins

# Builds the Paper plugin bundle from `develop` and publishes it as the rolling
# `dev-latest` prerelease. Nothing here reaches the dev server directly: the
# deploy agent on that machine (ops/dev-server/agent.mjs) polls this release,
# and when its commit changes it migrates the sandbox database, swaps the jars
# and bounces the server. See wiki/ci-cd.md.

on:
  push:
    branches: [ develop ]
    # Everything that ends up in a plugin jar or the schema it runs against.
    paths:
      - 'treasury/**'
      - 'business/**'
      - 'chestshop/**'
      - 'treasury-api-plugin/**'
      - 'common/**'
      - 'economy-flyway/**'
      - 'build-logic/**'
      - 'gradle/**'
      - 'gradle.properties'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/dev-server-publish.yml'
      - '.github/actions/setup-jvm/**'
      - '.github/scripts/release-metadata*'
  workflow_dispatch:

permissions:
  contents: write        # recreate the dev-latest release and its tag

# Queue rather than cancel, so releases are replaced in push order; a pending
# run is superseded by a newer one, which is what we want.
concurrency:
  group: dev-server-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JVM build
        uses: ./.github/actions/setup-jvm

      - name: Compute development version
        id: release
        run: node .github/scripts/release-metadata.mjs version

      - name: Check release metadata tooling
        run: node --test .github/scripts/release-metadata.test.mjs

      - name: Build plugin bundle
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: sh ./gradlew release -Pci=true -Pversion="$RELEASE_VERSION"

      - name: Write manifest
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: node .github/scripts/release-metadata.mjs manifest

      - name: Replace dev-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete dev-latest --cleanup-tag --yes || true
          gh release create dev-latest release/*.jar release/manifest.json \
            --prerelease --latest=false --target "$GITHUB_SHA" \
            --title "Dev server build (${GITHUB_SHA::7})" \
            --notes "Rolling build of \`develop\` at ${GITHUB_SHA}, picked up by the dev server's deploy agent. Not a release."
