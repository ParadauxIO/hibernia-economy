name: Treasury · Build & Publish API

on:
  push:
    branches: ['**']

permissions:
  contents: read

jobs:
  deployment-policy:
    uses: ./.github/workflows/deployment-policy.yml

  # Don't publish an API jar that doesn't pass its tests (ADT-52). Same job
  # definition ci.yml runs, narrowed to the Treasury projects.
  test:
    needs: deployment-policy
    if: needs.deployment-policy.outputs.allowed == 'true'
    uses: ./.github/workflows/jvm-check.yml
    with:
      tasks: ':treasury:check :treasury:treasury-api:check'
      check-name: treasury-api publish tests
    permissions:
      contents: read
      checks: write

  publish:
    concurrency:
      group: treasury-publish-api-${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}
      cancel-in-progress: false
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up JVM build
        uses: ./.github/actions/setup-jvm

      - name: Determine base version
        id: ver
        run: |
          BASE_VERSION="$(sh ./gradlew -q :treasury:treasury-api:properties | awk -F': ' '/^version:/ {print $2}' | head -n1)"
          echo "base=$BASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "Base version: $BASE_VERSION"

      # Main releases are published together by plugin-release.yml.
      - name: Compute snapshot version
        id: pick
        env:
          BASE: ${{ steps.ver.outputs.base }}
        run: echo "version=${BASE%-SNAPSHOT}-SNAPSHOT" >> "$GITHUB_OUTPUT"

      - name: Build & publish treasury-api
        env:
          REPO_USER: ${{ secrets.REPO_USER }}
          REPO_PASS: ${{ secrets.REPO_PASS }}
          VERSION: ${{ steps.pick.outputs.version }}
        run: sh ./gradlew :treasury:treasury-api:clean :treasury:treasury-api:publish -Pversion="$VERSION"
