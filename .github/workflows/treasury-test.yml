name: Treasury · Test & Coverage

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'treasury/**'
      - 'common/**'                  # implementation(project(":common"))
      - 'test-support/**'            # testImplementation(project(":test-support"))
      - 'economy-flyway/**'          # migrations are staged onto the test classpath
      - '.github/workflows/treasury-test.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'treasury/**'
      - 'common/**'                  # implementation(project(":common"))
      - 'test-support/**'            # testImplementation(project(":test-support"))
      - 'economy-flyway/**'          # migrations are staged onto the test classpath
      - '.github/workflows/treasury-test.yml'
  workflow_call:        # reused as a gate by treasury-publish-api.yml (ADT-52)
  workflow_dispatch:

permissions:
  contents: read
  checks: write          # surface JUnit results as a check
  pull-requests: write   # post coverage comment on PRs

jobs:
  test:
    runs-on: ubuntu-latest

    # Real MariaDB alongside the runner. Tests connect via TREASURY_TEST_JDBC_URL,
    # which makes MariadbContainerExtension skip its embedded MariaDB4j path
    # (whose bundled binary needs system libs Ubuntu 24.04 doesn't ship).
    services:
      mariadb:
        # Pin to 10.11 LTS — matches what MariaDB4j ships locally so CI behaviour
        # mirrors local. MariaDB 11 has surfaced flaky InnoDB row-version errors
        # (HA_ERR_RECORD_CHANGED #1020) under high concurrency with the AFTER INSERT
        # triggers on account_balances_mat.
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: treasury
          MARIADB_DATABASE: treasury_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=2s
          --health-retries=20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      # The schema is applied by the test harness itself: MariadbContainerExtension
      # runs the authoritative economy-flyway migrations with Flyway against this
      # service DB (no bundled schema.sql). The service only needs to provide an
      # empty treasury_test database.
      - name: Run tests + verify coverage
        env:
          TREASURY_TEST_JDBC_URL: jdbc:mariadb://127.0.0.1:3306/treasury_test
          TREASURY_TEST_DB_USER: root
          TREASURY_TEST_DB_PASS: treasury
        run: ./gradlew --no-daemon :treasury:test :treasury:jacocoTestReport :treasury:jacocoTestCoverageVerification -Pci=true

      - name: Publish test results
        if: always()
        uses: mikepenz/action-junit-report@db71d41eb79864e25ab0337e395c352e84523afe # v4.3.1
        with:
          report_paths: 'treasury/**/build/test-results/test/TEST-*.xml'
          require_tests: true
          detailed_summary: true

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: treasury-test-report
          path: |
            treasury/build/reports/tests/
            treasury/build/reports/jacoco/
            treasury/**/build/test-results/

      # PR-only: comment with overall + per-changed-file coverage and gate at 80 %
      # for files touched by this PR. The 95 % global gate is enforced above by
      # jacocoTestCoverageVerification.
      - name: Coverage gate (changed files ≥ 80 %)
        if: github.event_name == 'pull_request'
        uses: madrapps/jacoco-report@7c362aca34caf958e7b1c03464bd8781db9f8da7 # v1.7.1
        with:
          paths: ${{ github.workspace }}/treasury/build/reports/jacoco/test/jacocoTestReport.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 95
          min-coverage-changed-files: 80
          title: Treasury coverage report
          update-comment: true
          pass-emoji: ':white_check_mark:'
          fail-emoji: ':x:'
