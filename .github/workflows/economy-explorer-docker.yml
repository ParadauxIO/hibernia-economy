name: Economy Explorer · Build and Push Docker Image to Harbor

# Pushes the explorer image after its tests pass. The tests are the same
# reusable workflow ci.yml runs (explorer-check.yml), so the image is gated on
# exactly what gates a merge.

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'economy-explorer/**'
      - '.github/workflows/economy-explorer-docker.yml'
      - '.github/workflows/explorer-check.yml'
  # Manual trigger so a release on `main` (production) can be (re)built and
  # deployed on demand — e.g. when `main` is created/advanced to an existing
  # commit and the path-filtered push event doesn't fire.
  workflow_dispatch:

# Least privilege (CodeQL actions/missing-workflow-permissions): every job only
# checks out the repo; the Harbor push authenticates with registry secrets, not
# the GITHUB_TOKEN.
permissions:
  contents: read

# Queue rather than cancel, so images are pushed in commit order.
concurrency:
  group: economy-explorer-docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/explorer-check.yml

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Compute tags
        id: tags
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          # Env-prefixed immutable tag — Argo CD Image Updater watches
          # `<env>-sha-<short>` per overlay.
          SHORT_SHA=${GITHUB_SHA::7}
          if [ "$REF_NAME" == "main" ]; then
            ENV_NAME=production
            MUTABLE=prod
          elif [ "$REF_NAME" == "develop" ]; then
            ENV_NAME=development
            MUTABLE=latest
          else
            echo "::error::Unsupported branch: $REF_NAME"
            exit 1
          fi
          echo "SHA_TAG=${ENV_NAME}-sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "MUTABLE_TAG=${MUTABLE}" >> "$GITHUB_OUTPUT"

      - name: Log in to Harbor registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ secrets.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build Docker image
        working-directory: economy-explorer
        env:
          IMAGE: ${{ secrets.HARBOR_REGISTRY }}/paradaux-public/economy-explorer
          SHA_TAG: ${{ steps.tags.outputs.SHA_TAG }}
          MUTABLE_TAG: ${{ steps.tags.outputs.MUTABLE_TAG }}
        run: docker build -t "${IMAGE}:${SHA_TAG}" -t "${IMAGE}:${MUTABLE_TAG}" .

      - name: Push Docker image
        env:
          IMAGE: ${{ secrets.HARBOR_REGISTRY }}/paradaux-public/economy-explorer
          SHA_TAG: ${{ steps.tags.outputs.SHA_TAG }}
          MUTABLE_TAG: ${{ steps.tags.outputs.MUTABLE_TAG }}
        run: |
          docker push "${IMAGE}:${SHA_TAG}"
          docker push "${IMAGE}:${MUTABLE_TAG}"
