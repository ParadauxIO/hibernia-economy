name: Economy Explorer · Build and Push Docker Image to Harbor

# Pushes the explorer image after its tests pass. The tests are the same
# reusable workflow ci.yml runs (explorer-check.yml), so the image is gated on
# exactly what gates a merge.

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deployment-policy:
    uses: ./.github/workflows/deployment-policy.yml
    with:
      allow-production: true

  test:
    needs: deployment-policy
    if: needs.deployment-policy.outputs.allowed == 'true'
    uses: ./.github/workflows/explorer-check.yml

  build-and-push:
    concurrency:
      group: economy-explorer-docker-${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}
      cancel-in-progress: false
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compute tags
        id: tags
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          # Env-prefixed immutable tag — Argo CD Image Updater watches
          # `<env>-sha-<short>` per overlay.
          SHORT_SHA=${GITHUB_SHA::7}
          if [ "$REF_NAME" == "main" ]; then
            ENV_NAME=production
            MUTABLE=prod
          else
            ENV_NAME=development
            MUTABLE=latest
          fi
          echo "SHA_TAG=${ENV_NAME}-sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "MUTABLE_TAG=${MUTABLE}" >> "$GITHUB_OUTPUT"

      - name: Log in to Harbor registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ secrets.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build Docker image
        working-directory: economy-explorer
        env:
          IMAGE: ${{ secrets.HARBOR_REGISTRY }}/paradaux-public/economy-explorer
          SHA_TAG: ${{ steps.tags.outputs.SHA_TAG }}
          MUTABLE_TAG: ${{ steps.tags.outputs.MUTABLE_TAG }}
        run: docker build -t "${IMAGE}:${SHA_TAG}" -t "${IMAGE}:${MUTABLE_TAG}" .

      - name: Push Docker image
        env:
          IMAGE: ${{ secrets.HARBOR_REGISTRY }}/paradaux-public/economy-explorer
          SHA_TAG: ${{ steps.tags.outputs.SHA_TAG }}
          MUTABLE_TAG: ${{ steps.tags.outputs.MUTABLE_TAG }}
        run: |
          docker push "${IMAGE}:${SHA_TAG}"
          docker push "${IMAGE}:${MUTABLE_TAG}"
