name: Business · Publish API

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'business/**'
      - '.github/workflows/business-publish-api.yml'
      - '.github/workflows/jvm-check.yml'
      - '.github/actions/setup-jvm/**'
  workflow_dispatch:

permissions:
  contents: read

# Queue rather than cancel: a cancelled publish can leave a half-cut release.
concurrency:
  group: business-publish-api-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Don't publish an API jar that doesn't pass its tests (ADT-52). Same job
  # definition ci.yml runs, narrowed to the Business projects (`:business:check`
  # includes testWithoutCarbon / testWithoutPlaceholderApi and the jacoco gate).
  test:
    uses: ./.github/workflows/jvm-check.yml
    with:
      tasks: ':business:check :business:business-api:check'
      check-name: business-api publish tests
    permissions:
      contents: read
      checks: write

  publish:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write        # create tags + GitHub releases on main

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up JVM build
        uses: ./.github/actions/setup-jvm

      - name: Determine base version
        id: ver
        run: |
          BASE_VERSION="$(sh ./gradlew -q :business:business-api:properties | awk -F': ' '/^version:/ {print $2}' | head -n1)"
          echo "base=$BASE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Compute publish version
        id: pick
        env:
          BASE: ${{ steps.ver.outputs.base }}
        run: |
          CORE="${BASE%-SNAPSHOT}"

          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            PUBLISH_VERSION="$CORE"
          else
            PUBLISH_VERSION="$CORE-SNAPSHOT"
          fi

          echo "version=$PUBLISH_VERSION" >> "$GITHUB_OUTPUT"

      - name: Build & publish business-api
        env:
          REPO_USER: ${{ secrets.REPO_USER }}
          REPO_PASS: ${{ secrets.REPO_PASS }}
          VERSION: ${{ steps.pick.outputs.version }}
        run: sh ./gradlew :business:business-api:clean :business:business-api:publish -Pversion="$VERSION"

      # Cut a git tag + GitHub release for non-SNAPSHOT publishes (main only).
      # Tagged per-artifact (business-api-v…) since this repo's release automation
      # publishes the API jar, not the plugin shadowJar. Idempotent per version.
      - name: Tag + GitHub release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.pick.outputs.version }}
        run: |
          TAG="business-api-v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — skipping."
            exit 0
          fi
          mapfile -t ASSETS < <(ls business/business-api/build/libs/*.jar 2>/dev/null || true)
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "business-api $VERSION" \
            --generate-notes \
            "${ASSETS[@]}"
