name: Treasury REST API · StateCraft JRE hotfix image

# Manual, main-only: re-packages the pinned StateCraft image with a patched
# JRE (treasury-rest-api/statecraft-hotfix/Dockerfile). The tag deliberately
# doesn't match Image Updater's `<env>-sha-<short>` pattern; gitops pins it.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Harbor registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ secrets.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build and push hotfix image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: treasury-rest-api/statecraft-hotfix
          push: true
          provenance: true
          sbom: true
          tags: ${{ secrets.HARBOR_REGISTRY }}/paradaux-public/treasury-rest-api:statecraft-a621f26-jre21.0.13.1
