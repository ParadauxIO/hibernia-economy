# NOTE: The /treasury help and /gov help indexes are now generated at runtime by
# the framework HelpGenerator (over CommandManager.routeIndex()), so the curated
# "treasury.help" and "treasury.help.gov[.*]" index keys were removed. The
# per-topic keys below are still shown by each command's own no-arg help route
# (e.g. /balance -> treasury.help.balance).

