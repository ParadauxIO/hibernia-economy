# Static Placeholders
# Anything after placeholder. is treated as a placeholder, which can be used in any of the below
# localisation configurations, you can define as many as you want here, and each are supported automatically.
placeholder.prefix=<bold><#aabfff>TREASURY</#aabfff></bold><#b8b8b8>»</#b8b8b8>

# Below are placeholders to use to keep a consistent colour palette. sec for secondary, then the beginning and ending tags.
placeholder.secbegin=<#aabfff>
placeholder.secend=</#aabfff>
placeholder.secgt=<#aabfff><</#aabfff>
placeholder.seclt=<#aabfff>></#aabfff>

# Dynamic Placeholders
# N.B: Not all messages support all of these placeholders.
# {version} -> plugin version
# {keyId} -> API key ID
# {accountId} -> account ID
# {token} -> API key token
# {count} -> count of keys
# {status} -> key status
# {expiry} -> key expiry date
# {firmId} -> firm ID
# {firmName} -> firm name
# {accountName} -> account name

# API Key status labels (list columns) + service-layer error keys (thrown as
# semantic exceptions from ApiKeyService, rendered by the command dispatcher)
# --------------------------------------------------------------------------------
treasuryapi.status.active=Active
treasuryapi.status.revoked=Revoked
treasuryapi.status.expiry-none=—
treasuryapi.key.not-found={prefix} <#ff9999>API key not found.</#ff9999>
treasuryapi.key.no-access={prefix} <#ff9999>You do not have permission to manage that API key.</#ff9999>
treasuryapi.key.revoked={prefix} <#ff9999>That key has been revoked and cannot be reissued. Issue a new key instead.</#ff9999>

# Plugin Info
# --------------------------------------------------------------------------------
treasuryapi.info={prefix} TreasuryAPI v{secbegin}{version}{secend} <#b8b8b8>- API key management</#b8b8b8>

# Personal Keys
# --------------------------------------------------------------------------------
treasuryapi.personal.issue.success={prefix} Personal API key {secbegin}#{keyId}{secend} issued for account {secbegin}{accountId}{secend}.\n<#b8b8b8>Token (click to copy):</#b8b8b8> <click:copy_to_clipboard:'{token}'>{secbegin}{token}{secend}</click>

treasuryapi.personal.list.header={prefix} {secbegin}Your Personal API Keys{secend} <#b8b8b8>({count} total)</#b8b8b8>
treasuryapi.personal.list.entry=<#b8b8b8>  #{keyId}</#b8b8b8> {secbegin}Account {accountId}{secend} <#b8b8b8>·</#b8b8b8> {status} <#b8b8b8>· exp. {expiry}</#b8b8b8>
treasuryapi.personal.list.empty={prefix} <#b8b8b8>You have not issued any personal API keys.</#b8b8b8>

treasuryapi.personal.reissue.success={prefix} Personal key {secbegin}#{keyId}{secend} reissued. Valid for 180 days.\n<#b8b8b8>New token (click to copy):</#b8b8b8> <click:copy_to_clipboard:'{token}'>{secbegin}{token}{secend}</click>
treasuryapi.personal.reissue.not-found={prefix} <#ff9999>Personal API key not found.</#ff9999>
treasuryapi.personal.reissue.no-access={prefix} <#ff9999>You do not own that API key.</#ff9999>
treasuryapi.personal.reissue.revoked={prefix} <#ff9999>That key has been revoked and cannot be reissued. Issue a new key instead.</#ff9999>

treasuryapi.personal.revoke.success={prefix} Personal API key {secbegin}#{keyId}{secend} has been revoked.
treasuryapi.personal.revoke.not-found={prefix} <#ff9999>Personal API key not found.</#ff9999>
treasuryapi.personal.revoke.no-access={prefix} <#ff9999>You do not own that API key.</#ff9999>

# Business Keys
# --------------------------------------------------------------------------------
treasuryapi.business.issue.success={prefix} Business API key {secbegin}#{keyId}{secend} issued for {secbegin}{firmName}{secend} (firm #{firmId}, {scope}).\n<#b8b8b8>Token (click to copy):</#b8b8b8> <click:copy_to_clipboard:'{token}'>{secbegin}{token}{secend}</click>
treasuryapi.business.issue.firm-not-found={prefix} <#ff9999>Firm not found.</#ff9999>
treasuryapi.business.issue.no-access={prefix} <#ff9999>Only the proprietor of a firm can issue API keys for it.</#ff9999>

treasuryapi.business.list.header={prefix} {secbegin}Your Business API Keys{secend} <#b8b8b8>({count} total)</#b8b8b8>
treasuryapi.business.list.entry=<#b8b8b8>  #{keyId}</#b8b8b8> {secbegin}Firm #{firmId}{secend} <#b8b8b8>· {scope} ·</#b8b8b8> {status} <#b8b8b8>· exp. {expiry}</#b8b8b8>
treasuryapi.business.list.empty={prefix} <#b8b8b8>You have not issued any business API keys.</#b8b8b8>

treasuryapi.business.list.access.header={prefix} {secbegin}Business API Keys (Employee Access){secend} <#b8b8b8>({count} total)</#b8b8b8>
treasuryapi.business.list.access.entry=<#b8b8b8>  #{keyId}</#b8b8b8> {secbegin}Firm #{firmId}{secend} <#b8b8b8>· {scope} ·</#b8b8b8> {status} <#b8b8b8>· exp. {expiry}</#b8b8b8>
treasuryapi.business.list.access.empty={prefix} <#b8b8b8>No business API keys found for firms you are employed at.</#b8b8b8>

treasuryapi.business.reissue.success={prefix} Business key {secbegin}#{keyId}{secend} reissued. Valid for 180 days.\n<#b8b8b8>New token (click to copy):</#b8b8b8> <click:copy_to_clipboard:'{token}'>{secbegin}{token}{secend}</click>
treasuryapi.business.reissue.not-found={prefix} <#ff9999>Business API key not found.</#ff9999>
treasuryapi.business.reissue.no-access={prefix} <#ff9999>You are not a proprietor of that firm.</#ff9999>
treasuryapi.business.reissue.revoked={prefix} <#ff9999>That key has been revoked and cannot be reissued. Issue a new key instead.</#ff9999>

treasuryapi.business.revoke.success={prefix} Business API key {secbegin}#{keyId}{secend} has been revoked.
treasuryapi.business.revoke.not-found={prefix} <#ff9999>Business API key not found.</#ff9999>
treasuryapi.business.revoke.no-access={prefix} <#ff9999>You are not a proprietor of that firm.</#ff9999>

# ---- Explorer UI access ----
treasuryapi.ui.user.added={prefix} Granted {secbegin}{role}{secend} to {secbegin}{player}{secend}.
treasuryapi.ui.user.removed={prefix} Removed {secbegin}{role}{secend} from {secbegin}{player}{secend}.
treasuryapi.ui.user.not-granted={prefix} <#b8b8b8>{player} did not have the {role} role.</#b8b8b8>
treasuryapi.ui.user.invalid-role={prefix} <#ff9999>Invalid role '{role}'. Use a role key configured in Explorer Admin → Roles.</#ff9999>
treasuryapi.ui.user.unknown-player={prefix} <#ff9999>No player named '{player}' has been seen on this server — refusing to grant a role to an unknown account.</#ff9999>
treasuryapi.ui.user.list={prefix} {secbegin}{player}{secend} <#b8b8b8>roles:</#b8b8b8> {roles}
treasuryapi.ui.user.no-roles={prefix} {secbegin}{player}{secend} <#b8b8b8>is a standard player with no elevated roles.</#b8b8b8>
treasuryapi.ui.link.success={prefix} <green>Your account is now linked to the explorer.</green>
treasuryapi.ui.link.partial={prefix} <green>Account linked.</green> <#b8b8b8>(Keycloak attribute update is pending; it will apply on next login.)</#b8b8b8>
treasuryapi.ui.link.invalid={prefix} <#ff9999>That link code is invalid or has expired. Generate a new one in the web UI.</#ff9999>
treasuryapi.ui.sync.done={prefix} <green>Your explorer roles have been synced from your in-game ranks.</green> <#b8b8b8>Refresh the web UI to see the change.</#b8b8b8>
treasuryapi.ui.sync.unavailable={prefix} <#b8b8b8>Role syncing isn't available on this server (LuckPerms not installed).</#b8b8b8>
treasuryapi.ui.sync.failed={prefix} <#ff9999>Couldn't sync your roles right now. Please try again shortly.</#ff9999>

# Email-free, player-only Keycloak recovery
treasuryapi.ui.reset.confirm={prefix} <yellow>This replaces your linked web account password. Run /treasuryapi ui resetpassword confirm to receive a temporary password privately.</yellow>
treasuryapi.ui.reset.success={prefix} <green>Password reset.</green> <#b8b8b8>Your temporary password:</#b8b8b8> <click:copy_to_clipboard:'{password}'>{secbegin}{password}{secend}</click> <#b8b8b8>(click to copy). Sign in on the web and choose a new password. Keep this secret; it may remain in your client chat log.</#b8b8b8>
treasuryapi.ui.reset.unavailable={prefix} <#ff9999>Password reset is unavailable. Contact staff.</#ff9999>
treasuryapi.ui.reset.unlinked={prefix} <#ff9999>No web account is linked to your Minecraft account. Contact staff for account recovery.</#ff9999>
treasuryapi.ui.reset.ambiguous={prefix} <#ff9999>Multiple web accounts are linked to your Minecraft account. Contact staff to resolve the links before resetting.</#ff9999>
treasuryapi.ui.reset.cooldown={prefix} <#ff9999>Please wait one minute between password reset attempts.</#ff9999>
treasuryapi.ui.reset.failed={prefix} <#ff9999>Could not confirm the password reset. Wait one minute and try again; contact staff if it persists.</#ff9999>

treasuryapi.business.issue.invalid-account={prefix} <#ff9999>That account is not linked to this active firm.</#ff9999>
treasuryapi.business.scope.firm=all accounts
treasuryapi.business.scope.account=account #{accountId}
