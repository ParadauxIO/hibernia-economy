# Secrets (database.password, keycloak.client-secret) can be supplied via env
# vars instead of plaintext here — env takes precedence: TREASURYAPI_DB_HOST,
# _DB_PORT, _DB_NAME, _DB_USERNAME, _DB_PASSWORD, _KEYCLOAK_CLIENT_SECRET. If you
# keep them in this file, chmod 600 it. The plugin refuses to start while the DB
# password is the default 'password'.
database:
  host: localhost
  port: 3306
  database: treasury
  username: root
  password: password

api:
  # Prefer random key material over a passphrase: set this to "base64:<value>"
  # where <value> is `openssl rand -base64 48`. Must be byte-identical to the
  # treasury-rest-api JWT_SECRET. Rotating it invalidates all live API tokens
  # (users reissue in-game). A plain passphrase still works via a legacy SHA-256
  # KDF but logs a warning — rotate to base64 key material. (ADT-23)
  jwt-secret: change-me-please-use-a-long-random-secret-key

# Keycloak Admin API for account linking and email-free password recovery.
# The service account needs permission to manage users (including reset-password).
# See wiki/password-recovery.md for setup and the Minecraft authentication boundary.
# Disabled by default; enable per server and set the service-account client
# secret out-of-band (never commit a real secret).
keycloak:
  enabled: false
  base-url: https://auth.paradaux.io
  realm: minecraft
  client-id: treasury-api-plugin
  client-secret: ""

# Reconciliation crons: sync LuckPerms, Business and Realty into Explorer groups.
# Each explorer_group with a luckperms_node set has its 'luckperms'-sourced
# members reconciled to match that node. The node is interpreted as a LuckPerms
# group name by default ("doc" or "group.doc"); a node containing a dot that is
# not "group.*" is treated as a permission node (e.g. "explorer.audit").
# LP also syncs account_group_access relationships and requires LuckPerms.
# Business/Realty mappings use explorer_group_sync (see wiki/group-reconciliation.md).
# These run independently of LP; Realty is optional.
# Runs at startup, then every 1–1800 real seconds, independently of server TPS.
# Derived snapshots expire after one hour if reconciliation cannot refresh them.
reconciliation:
  enabled: true
  interval-seconds: 1800
