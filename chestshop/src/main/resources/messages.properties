# ── ChestShop messages ──────────────────────────────────────────────────────
# Styled to match Treasury: a bold light-blue brand + grey chevron prefix, the #aabfff
# secondary accent (secbegin/secend) for names/values, <green> for prices, <#b8b8b8>
# for labels, <#ff9999> for errors. The separating space is baked into the prefix, so
# templates put {prefix} immediately before content and un-prefixed sub-lines
# (sent via Message.send, which blanks {prefix}) carry no stray leading space.
placeholder.prefix=<bold><#aabfff>SHOP</#aabfff></bold> <#b8b8b8>» </#b8b8b8>
placeholder.secbegin=<#aabfff>
placeholder.secend=</#aabfff>

chestshop.prefix=<bold><#aabfff>SHOP</#aabfff></bold> <#b8b8b8>» </#b8b8b8>

chestshop.shopinfo={prefix}{secbegin}Shop Information{secend}\n<#b8b8b8>Owner:</#b8b8b8> {secbegin}{owner}{secend}\n<#b8b8b8>Stock:</#b8b8b8> {secbegin}{stock}{secend}\n<#b8b8b8>Item:</#b8b8b8> {item}
chestshop.shopinfo_buy={prefix}<#b8b8b8>Buy</#b8b8b8> {secbegin}{amount}{secend} <#b8b8b8>for</#b8b8b8> <green>{price}</green>
chestshop.shopinfo_sell={prefix}<#b8b8b8>Sell</#b8b8b8> {secbegin}{amount}{secend} <#b8b8b8>for</#b8b8b8> <green>{price}</green>

chestshop.iteminfo={prefix}{secbegin}Item Information{secend}
chestshop.iteminfo_fullname={prefix}<#b8b8b8>Full Name:</#b8b8b8> {item}
chestshop.iteminfo_shopname={prefix}<#b8b8b8>Shop Sign:</#b8b8b8> {item}
chestshop.iteminfo_repaircost={prefix}<#b8b8b8>Repair Cost:</#b8b8b8> {secbegin}{cost}{secend}
chestshop.iteminfo_book={prefix}<#b8b8b8>Book Title:</#b8b8b8> {secbegin}{title}{secend}\n<#b8b8b8>Book Author:</#b8b8b8> {secbegin}{author}{secend}\n<#b8b8b8>Book Pages:</#b8b8b8> {secbegin}{pages}{secend}
