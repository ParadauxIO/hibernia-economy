chestshop.iteminfo_crossbow_projectile={prefix}{item}
chestshop.iteminfo_lore={prefix}<#b8b8b8>Lore:</#b8b8b8>\n{lore}

chestshop.METRICS={prefix}{secbegin}Metrics{secend}\n<#b8b8b8>Accounts:</#b8b8b8> {secbegin}{accounts}{secend}\n<#b8b8b8>Average transactions:</#b8b8b8> {secbegin}{totalTransactions}{secend} <#b8b8b8>(buy:</#b8b8b8> {secbegin}{buyTransactions}{secend} <#b8b8b8>sell:</#b8b8b8> {secbegin}{sellTransactions}{secend}<#b8b8b8>)</#b8b8b8>\n<#b8b8b8>Average items traded:</#b8b8b8> {secbegin}{totalItems}{secend} <#b8b8b8>(bought:</#b8b8b8> {secbegin}{boughtItems}{secend} <#b8b8b8>sold:</#b8b8b8> {secbegin}{soldItems}{secend}<#b8b8b8>)</#b8b8b8>

