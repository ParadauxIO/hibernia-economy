chestshop.iteminfo_recipes={prefix}<#b8b8b8>Recipe Knowledge:</#b8b8b8>
chestshop.iteminfo_map_view={prefix}<#b8b8b8>Map ID:</#b8b8b8> {secbegin}{id}{secend}\n<#b8b8b8>Map World:</#b8b8b8> {secbegin}{world}{secend}\n<#b8b8b8>Map Center:</#b8b8b8> {secbegin}{x}/{z}{secend}\n<#b8b8b8>Map Locked:</#b8b8b8> {secbegin}locked{secend}
