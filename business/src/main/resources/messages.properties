# Static Placeholders
# Anything after placeholder. is treated as a placeholder, which can be used in any of the below
# localisation configurations, you can define as many as you want here, and each are supported automatically.
placeholder.prefix=<bold><#aabfff>BUSINESS</#aabfff></bold> <#b8b8b8>»</#b8b8b8>

# Below are placeholders to use to keep a consistent colour palette. sec for secondary, then the beginning and ending tags.
placeholder.secbegin=<#aabfff>
placeholder.secend=</#aabfff>
placeholder.secgt=<#aabfff><</#aabfff>
placeholder.seclt=<#aabfff>></#aabfff>

# Dynamic Placeholders
# N.B: Not all messages support all of these placeholders.
# {sender} -> sender's username
# {target} -> target's username
# {firm} -> firm name
# {firmId} -> firm's ID

# General
# --------------------------------------------------------------------------------
business.general.no-permission={prefix} You do not have permission to run this command.

# Admin: /business reload
business.admin.reload.failed={prefix} <#ff9999>Reload failed: {error} (see console).</#ff9999>
business.admin.reload.success={prefix} <green>Reloaded messages.properties and config.yml (firm limits + balance-tax brackets). DB pool and scheduled jobs still need a restart.</green>

# Help is now generated from the command route index by the framework
# HelpGenerator (see HelpCommands) — there are no hand-maintained help pages.


