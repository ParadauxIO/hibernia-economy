business.firm.list.all.header={prefix} Firms (page {page})

# --- /firm baltop ------------------------------------------------------------
# Leaderboard of firms by collective balance across all their treasury accounts.
# {page}/{pages}: current/total pages. {rank}: position. {firm}: firm name.
# {balance}: the firm's total balance (already currency-formatted). {next}: next page.
business.firm.baltop.header={prefix} {secbegin}Top Firms{secend} <#b8b8b8>(Page {page}/{pages})</#b8b8b8>
business.firm.baltop.entry=<#b8b8b8>{rank}.</#b8b8b8> <click:run_command:'/db info {firm}'>{secbegin}{firm}{secend}</click> <#b8b8b8>-</#b8b8b8> <green>{balance}</green>
business.firm.baltop.footer=<#b8b8b8>Use</#b8b8b8> <click:run_command:'/firm baltop {next}'>{secbegin}/firm baltop {next}{secend}</click> <#b8b8b8>for the next page.</#b8b8b8>
