# jqwik's failure database: failing seeds are recorded here and replayed (and
# shrunk) first on the next run. Kept under build/ so it never lands in git and a
# `clean` resets it. Relative to the Gradle test working dir (the module dir).
jqwik.database = build/jqwik-database
# Keep successful properties quiet; failures still print seed + shrunk sample.
jqwik.reporting.onlyfailures = true
